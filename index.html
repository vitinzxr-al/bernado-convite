<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fazendinha do Bernardo - 2 Aninhos</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA 1: VÍDEO DE CAPA -->
    <div id="video-screen" class="screen">
        <video id="intro-video" autoplay muted playsinline webkit-playsinline preload="auto">
            <source src="video_1.mp4" type="video/mp4">
            Seu navegador não suporta vídeos.
        </video>
        <!-- O clique em qualquer lugar da tela avança para o convite -->
        <button class="btn-abrir-convite" onclick="irParaConvite()"></button>
    </div>

    <!-- TELA 2: O CONVITE COM O FUNDO DO CELEIRO -->
    <div id="invitation-screen" class="screen hidden">
        <div class="barn-background">
            
            <!-- Botão de Voltar -->
            <button class="btn-voltar" onclick="voltarAoVideo()">⬅️ Voltar</button>

            <!-- Textos posicionados em cima da placa do pergaminho -->
            <div class="card-content">
                <h1 class="child-name">Bernardo</h1>
                <span class="age-tag">2 anos</span>
                
                <div class="event-details">
                    <p class="event-text">Com muita alegria, convidamos você para comemorar meu aniversário!</p>
                    <p><strong>📅 Data:</strong> 02/01 (Sábado) — 19h</p>
                    <p class="drink-note">🍸 Bebida alcoólica por conta de cada convidado. Traga a sua preferida!</p>
                </div>
            </div>

            <!-- Botões na parte inferior -->
            <div class="bottom-buttons">
                <button class="custom-btn" onclick="confirmarPresenca()"></button>
                <button class="custom-btn" onclick="abrirMapa()"></button>
            </div>

        </div>
    </div>

    <!-- ÁUDIO DE FUNDO -->
    <audio id="background-music" loop>
        <source src="musica.mp3" type="audio/mp3">
        Seu navegador não suporta áudio.
    </audio>

    <!-- Controle de Música Flutuante -->
    <div class="music-control-box">
        <button id="music-btn" class="music-toggle-btn" onclick="toggleMusica()">
            🎵 <span id="music-status">Tocar</span>
        </button>
    </div>
   
    <script src="script.js"></script>
</body>
</html>
